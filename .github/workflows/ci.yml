name: CI/CD

on:
  push:
    branches: [main, hardening/*, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  DJANGO_SETTINGS_MODULE: travelhub.settings.testing
  # Claves SOLO para CI/tests — nunca cifran datos reales ni se usan en
  # dev/prod. No reutilizarlas fuera de este workflow.
  SECRET_KEY: ci-secret-key-not-used-in-production-12345678901234567890
  ENCRYPTION_KEY: ujK9r7o7B-B-jH87L2K0XvB4oK9zB_M3_z6vG1T_P5U=
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_NAME: travelhub_test
  PYTHONUNBUFFERED: "1"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.11.2
      - run: ruff check . --output-format=github
      - run: ruff format --check .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-w596-4wfm-2c5v || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travelhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev libpango-1.0-0 libpangocairo-1.0-0 shared-mime-info

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install psycopg2-binary pytest-cov

      - name: Create pg_trgm extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d travelhub_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Check migrations in sync (drift detector)
        run: |
          python manage.py makemigrations --check --dry-run --settings=travelhub.settings.testing

      - name: Apply all migrations to empty test DB
        run: |
          python manage.py migrate --noinput --settings=travelhub.settings.testing

      - name: Quick pre-check — unit tests (sin DB)
        run: |
          pytest tests/unit/ -m unit -q --tb=short -x --no-header

      - name: Run tests with coverage
        run: |
          pytest \
            --nomigrations \
            --create-db \
            --timeout=300 \
            --cov=. \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=75 \
            --ignore=tests/e2e \
            -v \
            --tb=short \
            -x

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ !cancelled() }}
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travelhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev libpango-1.0-0 libpangocairo-1.0-0 shared-mime-info
      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install psycopg2-binary pytest-cov pytest-playwright
      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps
      - name: Create pg_trgm extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d travelhub_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: Collect static files
        run: |
          python manage.py collectstatic --noinput --settings=travelhub.settings.testing
      - name: Run E2E tests
        run: |
          pytest tests/e2e/ \
            --nomigrations \
            -m e2e \
            -v \
            --tb=short \
            --timeout=120

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    outputs:
      tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to staging VPS
        run: |
          TAG="sha-${{ github.sha }}"
          REGISTRY_URL="${{ env.REGISTRY }}/${{ github.repository }}:$TAG"

          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} "
            set -e
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            echo 'Pulling image...'
            docker pull $REGISTRY_URL

            echo 'Tagging for compose...'
            docker tag $REGISTRY_URL travelhub_web:latest
            docker tag $REGISTRY_URL travelhub_celery_worker:latest
            docker tag $REGISTRY_URL travelhub_celery_notifications:latest
            docker tag $REGISTRY_URL travelhub_celery_beat:latest

            cd /opt/travelhub

            echo 'Running migrations first...'
            docker compose run --rm web python manage.py migrate --noinput

            echo 'Collecting static files...'
            docker compose run --rm web python manage.py collectstatic --noinput

            echo 'Restarting services...'
            docker compose up -d web nginx celery_worker celery_notifications celery_beat

            echo 'Health check...'
            sleep 15
            docker compose exec -T web python compose/healthcheck.py && echo 'OK' || exit 1

            echo 'Pruning...'
            docker system prune -af --filter 'until=24h'
          "

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production VPS
        run: |
          TAG="sha-${{ github.sha }}"
          REGISTRY_URL="${{ env.REGISTRY }}/${{ github.repository }}:$TAG"

          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} "
            set -e
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            echo 'Pulling image...'
            docker pull $REGISTRY_URL

            echo 'Snapshotting current image for rollback...'
            if docker image inspect travelhub_web:latest >/dev/null 2>&1; then
              docker tag travelhub_web:latest travelhub_web:rollback
              for svc in celery_worker celery_notifications celery_beat; do
                docker image inspect travelhub_\${svc}:latest >/dev/null 2>&1 && \
                  docker tag travelhub_\${svc}:latest travelhub_\${svc}:rollback || true
              done
              HAS_ROLLBACK=1
            else
              HAS_ROLLBACK=0
            fi

            echo 'Tagging for compose...'
            docker tag $REGISTRY_URL travelhub_web:latest
            docker tag $REGISTRY_URL travelhub_celery_worker:latest
            docker tag $REGISTRY_URL travelhub_celery_notifications:latest
            docker tag $REGISTRY_URL travelhub_celery_beat:latest

            cd /opt/travelhub

            echo 'Running migrations first...'
            docker compose run --rm web python manage.py migrate --noinput

            echo 'Collecting static files...'
            docker compose run --rm web python manage.py collectstatic --noinput

            echo 'Restarting web + nginx (zero-downtime via --no-deps)...'
            docker compose up -d --no-deps web nginx

            echo 'Health check (retrying up to 120s)...'
            HEALTHY=0
            for i in \$(seq 1 12); do
              sleep 10
              if curl -sSf https://${{ secrets.PROD_DOMAIN }}/health/ > /dev/null 2>&1; then
                HEALTHY=1
                break
              fi
            done
            if [ "\$HEALTHY" = "1" ]; then
              echo 'Health check PASSED'
            else
              echo 'Health check FAILED — rolling back to previous image...'
              if [ "\$HAS_ROLLBACK" = "1" ]; then
                docker tag travelhub_web:rollback travelhub_web:latest
                docker compose up -d --no-deps web nginx
              fi
              exit 1
            fi

            echo 'Restarting celery workers...'
            docker compose up -d --no-deps celery_worker celery_notifications celery_beat

            echo 'Pruning...'
            docker system prune -af --filter 'until=48h'
          "

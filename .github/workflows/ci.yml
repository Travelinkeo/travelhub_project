name: CI

on:
  push:
    branches: [main, hardening/*, staging]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SETTINGS_MODULE: travelhub.settings.testing
  SECRET_KEY: ci-secret-key-not-used-in-production-12345678901234567890
  ENCRYPTION_KEY: ujK9r7o7B-B-jH87L2K0XvB4oK9zB_M3_z6vG1T_P5U=
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_NAME: travelhub_test
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.11.2
      - run: ruff check . --output-format=github
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travelhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev libpango-1.0-0 libpangocairo-1.0-0 shared-mime-info

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install psycopg2-binary pytest-cov

      - name: Create pg_trgm extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d travelhub_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Run tests with coverage
        run: |
          pytest \
            --nomigrations \
            --create-db \
            --timeout=300 \
            --cov=. \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=30 \
            -v \
            --tb=short \
            -x

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ !cancelled() }}
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

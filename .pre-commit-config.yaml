# .pre-commit-config.yaml

# Repositorios de hooks. Cada 'repo' es una fuente de hooks.
repos:
  # --- Hooks estándar para calidad de código Python ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4 # Usa una versión específica para builds reproducibles
    hooks:
      # Ejecuta el linter de ruff y intenta arreglar errores automáticamente
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Ejecuta el formateador de ruff
      - id: ruff-format

  # --- Hook local para nuestras reglas de arquitectura custom ---
  - repo: local
    hooks:
      - id: check-domain-imports
        name: "Check for illegal domain imports"
        entry: python scripts/check_domain_imports.py
        language: python
        types: [python]
        # Excluimos el propio script de la verificación para evitar que se analice a sí mismo
        exclude: ^scripts/check_domain_imports\.py$

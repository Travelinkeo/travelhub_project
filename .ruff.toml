line-length = 100
indent-width = 4
target-version = "py313"

[lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "UP", # pyupgrade
  "S",  # flake8-bandit (algunos chequeos de seguridad básicos)
  "C4", # flake8-comprehensions
]
ignore = [
  "E203",  # estilo de slicing (compatible con black)
  "E501",  # longitud de línea (usamos black + 100 chars, ruff avisaría demasiadas)
]

[lint.per-file-ignores]
"*/migrations/*" = ["E501", "S", "I001", "F401"]
"tests/*" = ["S", "B011", "S101"]
"**/tests/*" = ["S101"]
"**/test_*.py" = ["S101"]
"conftest.py" = ["S101"]
"**/conftest.py" = ["S101"]
"scripts/*" = ["E402", "F841", "E722", "B007", "UP038", "F821"]
"scripts/testing/*" = ["E402", "F841", "E722", "B007", "UP038", "F821"]
"scripts/tools/*" = ["E402", "F841", "E722", "B007", "UP038", "F821"]
"scripts/diagnostics/*" = ["E402", "F841", "E722", "B007", "UP038", "F821"]
".agents/scripts/*" = ["E402", "F841", "E722", "B007", "UP038", "F821", "C401", "C4"]
".agents/tmp/*" = ["E402", "F841", "E722", "B007", "UP038", "F821"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

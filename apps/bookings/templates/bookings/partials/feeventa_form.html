<form hx-post="{% url 'bookings:fee_venta_add' venta_pk=venta_pk %}" hx-target="this" hx-swap="outerHTML" class="space-y-4">
    {% csrf_token %}

    <div class="space-y-3.5">
        <div>
            <label class="block text-xs font-bold text-text-secondary uppercase tracking-wider mb-1.5">Tipo de Fee</label>
            <select name="tipo_fee"
                class="w-full bg-surface-1 border border-border-color rounded-xl px-3.5 py-2 text-xs text-text-main focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                <option value="GST" class="bg-surface-1 text-text-main">Fee Agencia</option>
                <option value="SRV" class="bg-surface-1 text-text-main">Fee por Servicio</option>
                <option value="OTR" class="bg-surface-1 text-text-main">Otros Cargos</option>
            </select>
        </div>

        <div>
            <label class="block text-xs font-bold text-text-secondary uppercase tracking-wider mb-1.5">Monto (USD)</label>
            <input type="number" step="0.01" name="monto" required placeholder="0.00"
                class="w-full bg-surface-1 border border-border-color rounded-xl px-3.5 py-2 text-xs font-bold text-text-main focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
        </div>

        <div>
            <label class="block text-xs font-bold text-text-secondary uppercase tracking-wider mb-1.5">Descripción</label>
            <input type="text" name="descripcion" placeholder="Ej: Fee por emisión urgente"
                class="w-full bg-surface-1 border border-border-color rounded-xl px-3.5 py-2 text-xs text-text-main placeholder-text-muted focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
        </div>
    </div>

    <div class="flex justify-end gap-2.5 pt-4 border-t border-border-color mt-4">
        <button type="button" @click="$dispatch('close-modal')"
            class="px-4 py-2 rounded-xl text-xs font-bold text-text-muted hover:text-text-main bg-surface-2 hover:bg-surface-3 border border-border-color transition-all">
            Cancelar
        </button>
        <button type="submit"
            class="px-5 py-2 rounded-xl bg-primary hover:bg-primary-hover text-[var(--text-on-primary)] font-bold text-xs shadow-md shadow-primary/20 transition-all">
            Agregar Fee
        </button>
    </div>
</form>

<form hx-post="{{ request.path }}" hx-target="#venta-totals-card" hx-swap="innerHTML"
    @htmx:after-request="$dispatch('close-modal'); window.location.reload();" class="space-y-4">
    {% csrf_token %}

    <div class="space-y-3.5">
        {% if not object %}
        <div>
            <label class="block text-xs font-bold text-text-secondary uppercase tracking-wider mb-1.5">Producto / Servicio</label>
            <div class="theme-select-wrapper">
                {{ form.producto_servicio }}
            </div>
        </div>
        {% endif %}

        <div>
            <label class="block text-xs font-bold text-text-secondary uppercase tracking-wider mb-1.5">Descripción Personalizada</label>
            <input type="text" name="descripcion_personalizada"
                value="{{ form.descripcion_personalizada.value|default:'' }}"
                placeholder="Descripción del ítem o servicio"
                class="w-full bg-surface-1 border border-border-color rounded-xl px-3.5 py-2 text-xs text-text-main placeholder-text-muted focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-bold text-text-secondary uppercase tracking-wider mb-1.5">Cantidad</label>
                <input type="number" name="cantidad" value="{{ form.cantidad.value|default:1 }}"
                    class="w-full bg-surface-1 border border-border-color rounded-xl px-3.5 py-2 text-xs font-bold text-text-main focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
            </div>
            <div>
                <label class="block text-xs font-bold text-text-secondary uppercase tracking-wider mb-1.5">Precio de Venta</label>
                <input type="number" step="0.01" name="precio_unitario_venta"
                    value="{{ form.precio_unitario_venta.value|default:'0.00' }}"
                    class="w-full bg-surface-1 border border-border-color rounded-xl px-3.5 py-2 text-xs font-bold text-text-main focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-bold text-text-secondary uppercase tracking-wider mb-1.5">Costo Neto (Prov)</label>
                <input type="number" step="0.01" name="costo_neto_proveedor"
                    value="{{ form.costo_neto_proveedor.value|default:'0.00' }}"
                    class="w-full bg-surface-1 border border-border-color rounded-xl px-3.5 py-2 text-xs font-bold text-text-main focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
            </div>
            {% if not object %}
            <div>
                <label class="block text-xs font-bold text-text-secondary uppercase tracking-wider mb-1.5">Proveedor</label>
                <div class="theme-select-wrapper">
                    {{ form.proveedor_servicio }}
                </div>
            </div>
            {% endif %}
        </div>
    </div>

    <div class="flex justify-end gap-2.5 pt-4 border-t border-border-color mt-4">
        <button type="button" @click="$dispatch('close-modal')"
            class="px-4 py-2 rounded-xl text-xs font-bold text-text-muted hover:text-text-main bg-surface-2 hover:bg-surface-3 border border-border-color transition-all">
            Cancelar
        </button>
        <button type="submit"
            class="px-5 py-2 rounded-xl bg-primary hover:bg-primary-hover text-[var(--text-on-primary)] font-bold text-xs shadow-md shadow-primary/20 transition-all">
            Guardar Cambios
        </button>
    </div>
</form>

<script nonce="{{ request.csp_nonce }}">
    // Estilizar selects generados por Django dentro del modal
    document.querySelectorAll('#modal-content select').forEach(s => {
        s.className = "w-full bg-surface-1 border border-border-color rounded-xl px-3.5 py-2 text-xs text-text-main focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all";
    });
</script>

<form hx-post="{% url 'bookings:pago_venta_add' venta_pk=venta_pk %}" hx-target="this" hx-swap="outerHTML"
    class="space-y-4" x-data="{ metodo: 'TRF', monto: '{{ venta.saldo_pendiente|stringformat:'.2f' }}', saldoDisponible: {{ cliente_saldo_a_favor|default:0 }} }">
    {% csrf_token %}

    {% if cliente_saldo_a_favor and cliente_saldo_a_favor > 0 %}
    <div class="p-3 bg-indigo-500/10 border border-indigo-500/20 rounded-xl flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-indigo-400 text-lg">account_balance_wallet</span>
            <div>
                <p class="text-[11px] font-bold text-indigo-300">Saldo a Favor del Cliente</p>
                <p class="text-xs font-black text-indigo-400 font-mono">${{ cliente_saldo_a_favor|floatformat:2 }} USD disponible</p>
            </div>
        </div>
        <button type="button"
            @click="metodo = 'SAF'; monto = Math.min({{ venta.saldo_pendiente|default:0 }}, saldoDisponible).toFixed(2)"
            class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-[10px] font-black uppercase tracking-wider transition-all shadow-sm shadow-indigo-900/30">
            Usar Saldo
        </button>
    </div>
    {% endif %}

    <div class="space-y-3.5">
        <div>
            <label class="block text-xs font-bold text-text-secondary uppercase tracking-wider mb-1.5">Monto Pagado (USD)</label>
            <input type="number" step="0.01" name="monto" x-model="monto" required placeholder="0.00"
                class="w-full bg-surface-1 border border-border-color rounded-xl px-3.5 py-2 text-xs font-bold text-text-main focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-mono">
        </div>

        <div>
            <label class="block text-xs font-bold text-text-secondary uppercase tracking-wider mb-1.5">Método de Pago</label>
            <select name="metodo" x-model="metodo"
                class="w-full bg-surface-1 border border-border-color rounded-xl px-3.5 py-2 text-xs text-text-main focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                {% if cliente_saldo_a_favor and cliente_saldo_a_favor > 0 %}
                <option value="SAF" class="bg-surface-1 text-indigo-400 font-bold">💳 Saldo a Favor / Billetera (${{ cliente_saldo_a_favor|floatformat:2 }})</option>
                {% endif %}
                <option value="TRF" class="bg-surface-1 text-text-main">Transferencia</option>
                <option value="ZEL" class="bg-surface-1 text-text-main">Zelle</option>
                <option value="EFE" class="bg-surface-1 text-text-main">Efectivo</option>
                <option value="TAR" class="bg-surface-1 text-text-main">Tarjeta</option>
                <option value="OTR" class="bg-surface-1 text-text-main">Otro</option>
            </select>
        </div>

        <div>
            <label class="block text-xs font-bold text-text-secondary uppercase tracking-wider mb-1.5">Referencia</label>
            <input type="text" name="referencia" placeholder="Nro de confirmación o transferencia"
                class="w-full bg-surface-1 border border-border-color rounded-xl px-3.5 py-2 text-xs text-text-main placeholder-text-muted focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
        </div>
    </div>

    <div class="flex justify-end gap-2.5 pt-4 border-t border-border-color mt-4">
        <button type="button" @click="$dispatch('close-modal')"
            class="px-4 py-2 rounded-xl text-xs font-bold text-text-muted hover:text-text-main bg-surface-2 hover:bg-surface-3 border border-border-color transition-all">
            Cancelar
        </button>
        <button type="submit"
            class="px-5 py-2 rounded-xl bg-status-success hover:bg-emerald-600 text-white font-bold text-xs shadow-md shadow-emerald-900/20 transition-all">
            Registrar Pago
        </button>
    </div>
</form>

<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4"
    @click.self="showVincularModal = false">
    <div class="bg-surface-1 border border-border-color rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden"
        @click.stop>
        <div class="h-1 w-full bg-gradient-to-r from-primary via-indigo-500 to-primary"></div>

        <!-- Modal Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-border-color">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-primary/10 border border-primary/20 flex items-center justify-center text-primary">
                    <span class="material-symbols-outlined text-[18px]">person_add</span>
                </div>
                <div>
                    <h2 class="text-sm font-bold text-text-main">Vincular Pasajero</h2>
                    <p class="text-[11px] text-text-muted">Asocia un viajero o dependiente a este cliente</p>
                </div>
            </div>
            <button @click="showVincularModal = false"
                class="w-8 h-8 flex items-center justify-center rounded-xl text-text-muted hover:text-text-main hover:bg-surface-2 transition-colors">
                <span class="material-symbols-outlined text-[18px]">close</span>
            </button>
        </div>

        <!-- Search -->
        <div class="px-6 py-4">
            <div class="relative">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted text-[18px]">search</span>
                <input type="text" name="q" placeholder="Buscar por nombre, apellido, cédula o pasaporte..." autofocus
                    class="w-full bg-surface-2 border border-border-color rounded-xl h-11 pl-10 pr-4 text-xs font-semibold text-text-main placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all"
                    hx-get="{% url 'crm:pasajero_search' %}?cliente_id={{ cliente_id }}"
                    hx-trigger="input changed delay:250ms, keyup changed delay:250ms"
                    hx-target="#pasajero-search-results"
                    hx-include="this">
            </div>
        </div>

        <!-- Results -->
        <div id="pasajero-search-results" class="px-6 pb-4 max-h-72 overflow-y-auto space-y-1">
            <p class="text-xs text-text-muted text-center py-6">Escribe para buscar pasajeros en el catálogo...</p>
        </div>

        <!-- Footer -->
        <div class="px-6 py-3.5 border-t border-border-color bg-surface-2/50 flex justify-end">
            <button @click="showVincularModal = false"
                class="px-4 py-2 text-xs font-bold text-text-muted hover:text-text-main bg-surface-2 border border-border-color rounded-xl hover:bg-surface-3 transition-colors">
                Cerrar
            </button>
        </div>
    </div>
</div>

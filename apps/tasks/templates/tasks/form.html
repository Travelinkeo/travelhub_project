{% load i18n %}

<h2 class="text-lg font-black text-text-main uppercase mb-6">
  {% if editing %}{% trans "Editar Tarea" %}{% else %}{% trans "Nueva Tarea" %}{% endif %}
</h2>

<form method="post" action="{% if editing %}{% url 'tasks:update' tarea.id %}{% else %}{% url 'tasks:create' %}{% endif %}"
      hx-post="{% if editing %}{% url 'tasks:update' tarea.id %}{% else %}{% url 'tasks:create' %}{% endif %}"
      hx-target="#modal-content" hx-swap="innerHTML"
      class="space-y-4">
  {% csrf_token %}

  <div>
    <label class="block text-sm font-bold text-text-main mb-1">{% trans "Título" %} *</label>
    <input type="text" name="titulo" value="{{ tarea.titulo|default:'' }}" required
           class="input-base w-full" placeholder="{% trans 'Resumen de la tarea' %}">
  </div>

  <div>
    <label class="block text-sm font-bold text-text-main mb-1">{% trans "Descripción" %}</label>
    <textarea name="descripcion" rows="4" class="input-base w-full" placeholder="{% trans 'Detalles de la tarea...' %}">{{ tarea.descripcion|default:'' }}</textarea>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-bold text-text-main mb-1">{% trans "Prioridad" %}</label>
      <select name="prioridad" class="input-base w-full">
        <option value="baja" {% if tarea.prioridad == 'baja' %}selected{% endif %}>{% trans "Baja" %}</option>
        <option value="media" {% if tarea.prioridad == 'media' or not tarea %}selected{% endif %}>{% trans "Media" %}</option>
        <option value="alta" {% if tarea.prioridad == 'alta' %}selected{% endif %}>{% trans "Alta" %}</option>
        <option value="urgente" {% if tarea.prioridad == 'urgente' %}selected{% endif %}>{% trans "Urgente" %}</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-bold text-text-main mb-1">{% trans "Estado" %}</label>
      <select name="estado" class="input-base w-full">
        <option value="pendiente" {% if tarea.estado == 'pendiente' or not tarea %}selected{% endif %}>{% trans "Pendiente" %}</option>
        <option value="en_progreso" {% if tarea.estado == 'en_progreso' %}selected{% endif %}>{% trans "En Progreso" %}</option>
        <option value="revision" {% if tarea.estado == 'revision' %}selected{% endif %}>{% trans "En Revisión" %}</option>
        <option value="completada" {% if tarea.estado == 'completada' %}selected{% endif %}>{% trans "Completada" %}</option>
        <option value="cancelada" {% if tarea.estado == 'cancelada' %}selected{% endif %}>{% trans "Cancelada" %}</option>
      </select>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-bold text-text-main mb-1">{% trans "Asignar a" %}</label>
      <select name="asignado_a" class="input-base w-full">
        <option value="">{% trans "Sin asignar" %}</option>
        {% for ua in current_agency.usuarioagencia_set.select_related %}
        <option value="{{ ua.usuario.id }}" {% if tarea.asignado_a_id == ua.usuario.id %}selected{% endif %}>
          {{ ua.usuario.email }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="block text-sm font-bold text-text-main mb-1">{% trans "Vence" %}</label>
      <input type="date" name="fecha_vencimiento" value="{{ tarea.fecha_vencimiento|date:'Y-m-d'|default:'' }}"
             class="input-base w-full">
    </div>
  </div>

  <div class="flex justify-end gap-3 pt-4 border-t border-border-color">
    <button type="button" @click="document.getElementById('modal-overlay').classList.add('hidden')"
            class="btn-secondary text-sm">{% trans "Cancelar" %}</button>
    <button type="submit" class="btn-primary text-sm">{% trans "Guardar" %}</button>
  </div>
</form>

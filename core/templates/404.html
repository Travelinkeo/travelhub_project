<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Página no encontrada | TravelHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0F172A; color: #E2E8F0; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
        .container { text-align: center; max-width: 480px; }
        .code { font-size: 7rem; font-weight: 800; background: linear-gradient(135deg, #60A5FA, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin-bottom: 0.5rem; }
        .title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
        .desc { color: #94A3B8; margin-bottom: 2rem; line-height: 1.6; }
        .btn { display: inline-block; background: #3B82F6; color: white; padding: 0.75rem 2rem; border-radius: 0.5rem; text-decoration: none; font-weight: 600; transition: background 0.2s; }
        .btn:hover { background: #2563EB; }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <h1 class="title">Página no encontrada</h1>
        <p class="desc">La página que buscas no existe o fue movida.<br>Revisa la URL o vuelve al inicio.</p>
        <a href="/" class="btn">Ir al inicio</a>
    </div>
</body>
</html>

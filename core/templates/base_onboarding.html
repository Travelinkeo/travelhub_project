{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TravelHub - Onboarding{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/css/tailwind-built.css' %}">
    <script defer src="{% static 'vendor/alpine.min.js' %}" {% if request.csp_nonce %}nonce="{{ request.csp_nonce }}"{% endif %}></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        @media (prefers-color-scheme: dark) {
            .glass-panel {
                background: rgba(15, 23, 42, 0.75);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
        }
    </style>
    {% if request.csp_nonce %}<style nonce="{{ request.csp_nonce }}">{% endif %}
    {% if request.csp_nonce %}</style>{% endif %}
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="min-h-screen flex flex-col">
        <header class="py-6 text-center">
            <img src="{% static 'images/Logo TravelHub.png' %}" alt="TravelHub" class="h-12 mx-auto">
        </header>
        <main class="flex-1 flex items-center justify-center px-4 pb-12">
            {% block content %}{% endblock %}
        </main>
        <footer class="py-4 text-center text-xs text-gray-400">
            &copy; 2026 TravelHub Pro. Todos los derechos reservados.
        </footer>
    </div>
</body>
</html>

<div x-data="{ aiPanelOpen: false }" @open-ai-panel.window="aiPanelOpen = true; document.getElementById('ai-panel-dialog').style.display='block'" x-cloak>
    <div id="ai-panel-dialog" x-show="aiPanelOpen" class="fixed inset-0 z-[100] overflow-hidden" aria-labelledby="slide-over-title" role="dialog" aria-modal="true">
        <div class="absolute inset-0 overflow-hidden">
            <div x-show="aiPanelOpen" x-transition.opacity.duration.300ms
                 @click="aiPanelOpen = false; document.getElementById('ai-panel-dialog').style.display='none'"
                 onclick="document.getElementById('ai-panel-dialog').style.display='none'"
                 class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" aria-hidden="true"></div>

            <div class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full md:pl-10">
                <div x-show="aiPanelOpen"
                     x-transition:enter="transform transition ease-in-out duration-300"
                     x-transition:enter-start="translate-x-full"
                     x-transition:enter-end="translate-x-0"
                     x-transition:leave="transform transition ease-in-out duration-300"
                     x-transition:leave-start="translate-x-0"
                     x-transition:leave-end="translate-x-full"
                     class="pointer-events-auto w-screen max-w-full md:max-w-md">

                    <div class="flex h-full flex-col bg-surface-1 shadow-[0_0_50px_rgba(0,0,0,0.5)] border-l border-[var(--ai-accent)]/30">
                        <div class="bg-gradient-to-r from-[var(--ai-accent)]/20 to-surface-1 px-3 md:px-4 py-4 md:py-6 border-b border-border-color flex justify-between items-center shrink-0">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-[var(--ai-accent)]/20 text-[var(--ai-accent)] flex items-center justify-center border border-[var(--ai-accent)]/30">
                                    <span class="material-symbols-outlined animate-pulse">smart_toy</span>
                                </div>
                                <div>
                                    <h2 class="text-base font-black text-text-main leading-tight">CFO Virtual</h2>
                                    <p class="text-[10px] text-[var(--ai-accent)] font-bold uppercase tracking-widest">TravelHub Intelligence</p>
                                </div>
                            </div>
                            <button @click="aiPanelOpen = false" onclick="document.getElementById('ai-panel-dialog').style.display='none'" class="text-text-muted hover:text-white transition-colors" style="cursor:pointer; z-index:9999; position:relative;" title="Cerrar">
                                <span class="material-symbols-outlined" style="font-size:28px;">close</span>
                            </button>
                        </div>

                        <div class="flex-1 overflow-y-auto p-6"
                             hx-get="{% url 'core:ai_business_advisor' %}"
                             hx-trigger="open-ai-panel from:body"
                             hx-target="#global-ai-advisor"
                             hx-indicator="#ai-global-loader">

                            <div id="ai-global-loader" class="htmx-indicator flex flex-col items-center justify-center h-full opacity-60">
                                <span class="material-symbols-outlined text-4xl text-purple-500 animate-spin mb-4">sync</span>
                                <p class="text-sm font-bold text-text-main animate-pulse">Analizando métricas de tu agencia...</p>
                            </div>

                            <div id="global-ai-advisor" class="h-full"></div>
                        </div>

                        <div class="p-4 border-t border-border-color bg-surface-2 text-center shrink-0">
                            <p class="text-[10px] text-text-muted font-bold flex items-center justify-center gap-1">
                                <span class="material-symbols-outlined text-[12px]">lock</span> Análisis privado generado por Gemini 2.0 Flash
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

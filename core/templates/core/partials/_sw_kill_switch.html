<script nonce="{{ request.csp_nonce }}">
(function () {
    const EXPECTED_VERSION = 'travelhub-v8';
    if (localStorage.getItem('pwa_sw_version') !== EXPECTED_VERSION) {
        if ('caches' in window) {
            caches.keys().then(function(names) {
                names.forEach(function(name) { caches.delete(name); });
            });
        }
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (var r of registrations) { r.unregister(); }
                localStorage.setItem('pwa_sw_version', EXPECTED_VERSION);
                window.location.reload();
            });
        } else {
            localStorage.setItem('pwa_sw_version', EXPECTED_VERSION);
            window.location.reload();
        }
        return;
    }

    if (!('serviceWorker' in navigator)) return;

    navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
        .then(function (registration) {
            registration.addEventListener('updatefound', function () {
                var newWorker = registration.installing;
                if (!newWorker) return;
                newWorker.addEventListener('statechange', function () {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                });
            });
            // Registrar sync periódico para datos pendientes
            if ('sync' in registration) {
                registration.sync.register('sync-pending').catch(function(){});
            }
        })
        .catch(function (err) {
            console.warn('[PWA] Service Worker no registrado:', err);
        });

    // --- Botón de instalación PWA ---
    var deferredPrompt = null;
    var installBtnHandlerAttached = false;
    window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        var installBtn = document.getElementById('pwa-install-btn');
        if (installBtn) {
            installBtn.classList.remove('hidden');
            if (!installBtnHandlerAttached) {
                installBtn.addEventListener('click', function () {
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        deferredPrompt.userChoice.then(function () {
                            deferredPrompt = null;
                            installBtn.classList.add('hidden');
                        });
                    }
                });
                installBtnHandlerAttached = true;
            }
        }
    });
    window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        var installBtn = document.getElementById('pwa-install-btn');
        if (installBtn) installBtn.classList.add('hidden');
    });

    // --- Indicador de conectividad offline/online ---
    var offlineIndicator = document.getElementById('offline-indicator');
    function updateOnlineStatus() {
        if (!offlineIndicator) return;
        if (navigator.onLine) {
            offlineIndicator.classList.add('hidden');
        } else {
            offlineIndicator.classList.remove('hidden');
        }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
})();
</script>

<script nonce="{{ request.csp_nonce }}">
// TravelHub PWA — Registro del Service Worker
(function () {
    // Migración forzada a la versión v3 para limpiar service workers viejos y resolver traducción
    const EXPECTED_VERSION = 'travelhub-v3';
    if (localStorage.getItem('pwa_sw_version') !== EXPECTED_VERSION) {
        if ('caches' in window) {
            caches.keys().then(function(names) {
                names.forEach(function(name) {
                    caches.delete(name);
                });
            });
        }
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let r of registrations) {
                    r.unregister();
                }
                localStorage.setItem('pwa_sw_version', EXPECTED_VERSION);
                console.log('[PWA] Service workers y cachés antiguos eliminados para actualización a v3.');
                window.location.reload();
            });
        } else {
            localStorage.setItem('pwa_sw_version', EXPECTED_VERSION);
            window.location.reload();
        }
        return;
    }

    if (!('serviceWorker' in navigator)) return;

    // Registrar el Service Worker
    navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
        .then(function (registration) {
            // Si hay una nueva versión disponible, activarla al recargar
            registration.addEventListener('updatefound', function () {
                const newWorker = registration.installing;
                if (!newWorker) return;
                newWorker.addEventListener('statechange', function () {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        // Nueva versión lista — notificar opcionalmente
                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                });
            });
        })
        .catch(function (err) {
            // No interrumpir la experiencia si falla el registro
            console.warn('[PWA] Service Worker no registrado:', err);
        });

    // --- Botón de instalación PWA ("Agregar a pantalla de inicio") ---
    let deferredPrompt = null;
    let installBtnHandlerAttached = false;
    window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        const installBtn = document.getElementById('pwa-install-btn');
        if (installBtn) {
            installBtn.classList.remove('hidden');
            if (!installBtnHandlerAttached) {
                installBtn.addEventListener('click', function () {
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        deferredPrompt.userChoice.then(function () {
                            deferredPrompt = null;
                            installBtn.classList.add('hidden');
                        });
                    }
                });
                installBtnHandlerAttached = true;
            }
        }
    });

    window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        const installBtn = document.getElementById('pwa-install-btn');
        if (installBtn) installBtn.classList.add('hidden');
    });
})();
</script>

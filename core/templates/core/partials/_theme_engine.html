            justify-content: center !important;
            vertical-align: middle !important;
            flex-shrink: 0 !important;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Giro de flechas en el sentido de las puntas */

        }

        button.bg-primary, button.bg-primary *,
        a.bg-primary, a.bg-primary *,
        .bg-primary, .bg-primary *,
        .text-on-primary, .text-on-primary * {
            color: var(--text-on-primary) !important;
        }

            color: var(--text-muted);
        }

        input[type="email"],

        input[type="date"],
        input[type="time"],
        input[type="password"],
        input[type="search"],

            color: var(--text-main) !important;
            border: 1px solid var(--border-color) !important;
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--text-muted) !important;
            opacity: 0.8 !important;
        }

        select option {
            background-color: var(--surface-1) !important;
            color: var(--text-main) !important;
        }

        select:focus,
        textarea:focus {
            outline: none !important;
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.15) !important;
        }

        /* ── Tablas Flexibles Theme ── */
        table { border-collapse: collapse; width: 100%; }
        thead th {
            background: var(--surface-2) !important;
            color: var(--text-muted) !important;
            font-size: 11px !important;
            font-weight: 700 !important;
            letter-spacing: 0.08em !important;
            text-transform: uppercase !important;
            border-bottom: 1px solid var(--border-color) !important;
            padding: 10px 16px !important;
        }
        tbody tr {
            border-bottom: 0.5px solid var(--border-color) !important;
            transition: background 0.1s ease;
        }
        tbody tr:nth-child(odd)  { background: rgba(0,0,0,0.02) !important; }
        tbody tr:nth-child(even) { background: transparent !important; }
        tbody tr:hover {
            background: var(--nav-active-bg) !important;
        }
        tbody td {
            padding: 10px 16px !important;
            color: var(--text-main) !important;
            font-size: 13px !important;
        }

        }
        td:has(> .amount), td[class*="amount"] {
            text-align: right;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        [x-cloak] { display: none !important; }

        /* ── DINAMIC BRANDING OVERRIDES ── */
        :root {

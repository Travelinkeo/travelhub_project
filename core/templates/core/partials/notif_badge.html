<span id="notif-badge"
      class="{% if unread_count == 0 %}hidden {% endif %}absolute -top-1 -right-1 size-4 bg-red-500 text-white text-[8px] font-black rounded-full flex items-center justify-center leading-none border-2 border-surface-base"
      hx-get="{% url 'core:notificaciones_badge' %}"
      hx-trigger="load, every 60s [document.visibilityState==='visible']"
      hx-swap="outerHTML">
    {% if unread_count > 0 %}{{ unread_count }}{% endif %}
</span>

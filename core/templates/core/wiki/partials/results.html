{% load core_tags %}
{% if articulos %}
<div class="space-y-3 animate-fade-in-up">
    {% for art in articulos %}
    <div class="p-3 rounded-lg shadow-sm"
         style="background: var(--surface-2); border-left: 4px solid var(--primary);">
        <div class="flex items-center gap-2 mb-1">
            <span class="text-xs font-bold px-1.5 py-0.5 rounded"
                  style="background: color-mix(in srgb, var(--primary) 20%, transparent); color: var(--primary);">
                INFO
            </span>
            <h4 class="text-sm font-bold" style="color: var(--text-main);">{{ art.titulo }}</h4>
        </div>
        <div class="text-xs prose prose-sm max-w-none prose-p:my-0" style="color: var(--text-secondary);">
            {{ art.contenido|sanitize_html_filter }}
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}

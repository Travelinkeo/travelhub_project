{% extends "base_onboarding.html" %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4" x-data="onboardingAgency()">
    <div class="w-full max-w-2xl">
        <!-- Progress -->
        <div class="flex items-center justify-center mb-8">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center text-sm font-bold">&#10003;</div>
                <div class="w-16 h-1 bg-green-500"></div>
                <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-bold">2</div>
                <div class="w-16 h-1 bg-gray-300"></div>
                <div class="w-8 h-8 rounded-full bg-gray-300 text-gray-600 flex items-center justify-center text-sm font-bold">3</div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Configura tu Agencia</h1>
            <p class="text-gray-500 mb-6">Estas registrado como <strong>{{ email }}</strong></p>

            {% if error %}
            <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">{{ error }}</div>
            {% endif %}

            <form method="post" x-on:submit="submitting = true">
                {% csrf_token %}

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre de la Agencia</label>
                        <input type="text" name="agency_name" required x-model="agencyName" x-on:input="updateSubdomain()"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Ej. Viajes Caribe">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Subdominio</label>
                        <div class="flex items-center">
                            <input type="text" name="subdomain" required x-model="subdomain"
                                   class="flex-1 px-4 py-3 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                   placeholder="viajes-caribe">
                            <span class="px-4 py-3 bg-gray-100 border border-l-0 border-gray-300 rounded-r-lg text-gray-500 text-sm">.travelhub.cc</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Pais</label>
                            <select name="country" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                <option value="VE">Venezuela</option>
                                <option value="CO">Colombia</option>
                                <option value="PA">Panama</option>
                                <option value="MX">Mexico</option>
                                <option value="AR">Argentina</option>
                                <option value="ES">Espana</option>
                                <option value="US">Estados Unidos</option>
                                <option value="DO">Republica Dominicana</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Moneda</label>
                            <select name="currency" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                <option value="USD">USD - Dolar</option>
                                <option value="EUR">EUR - Euro</option>
                                <option value="COP">COP - Peso Colombiano</option>
                                <option value="MXN">MXN - Peso Mexicano</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Color de Marca</label>
                        <div class="flex items-center space-x-3">
                            <input type="color" name="brand_color" x-model="brandColor" class="w-12 h-12 rounded cursor-pointer border-0">
                            <input type="text" x-model="brandColor" class="flex-1 px-4 py-3 border border-gray-300 rounded-lg font-mono text-sm"
                                   placeholder="#3b82f6">
                        </div>
                    </div>

                    <!-- Plan Selection -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-3">Selecciona tu Plan</label>
                        <div class="grid grid-cols-2 gap-3">
                            {% for plan_key, plan_info in plans.items %}
                            <label class="relative flex flex-col p-4 border-2 rounded-lg cursor-pointer transition-all"
                                   :class="selectedPlan === '{{ plan_key }}' ? 'border-blue-500 bg-blue-50' : 'border-gray-200 hover:border-blue-300'">
                                <input type="radio" name="plan" value="{{ plan_key }}" x-model="selectedPlan"
                                       class="sr-only">
                                <div class="font-semibold text-gray-900">{{ plan_info.name }}</div>
                                <div class="text-2xl font-bold text-blue-600">${{ plan_info.price }}<span class="text-sm font-normal text-gray-500">/mes</span></div>
                                <div class="text-xs text-gray-500 mt-1">{{ plan_info.max_users }} usuarios &bull; {{ plan_info.max_sales }} ventas/mes</div>
                                {% if plan_key == 'FREE' %}
                                <span class="absolute top-2 right-2 text-xs bg-green-100 text-green-700 px-2 py-1 rounded">30 dias trial</span>
                                {% endif %}
                            </label>
                            {% endfor %}
                        </div>
                    </div>
                </div>

                <div class="mt-6 flex justify-end">
                    <button type="submit" :disabled="submitting"
                            class="px-8 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 disabled:opacity-50 transition">
                        <span x-show="!submitting">Continuar al Pago</span>
                        <span x-show="submitting">Procesando...</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function onboardingAgency() {
    return {
        agencyName: '',
        subdomain: '',
        brandColor: '#3b82f6',
        selectedPlan: 'FREE',
        submitting: false,
        updateSubdomain() {
            this.subdomain = this.agencyName
                .toLowerCase()
                .replace(/[^a-z0-9\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')
                .substring(0, 30);
        }
    }
}
</script>
{% endblock %}

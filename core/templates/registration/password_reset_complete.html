{% load static %}
<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña actualizada | TravelHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0F172A; color: #E2E8F0; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
        .card { background: #1E293B; border: 1px solid #334155; border-radius: 1rem; padding: 2.5rem; max-width: 420px; width: 100%; text-align: center; }
        .logo { font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem; }
        .logo span { color: #60A5FA; }
        .icon { font-size: 3rem; margin-bottom: 1rem; }
        h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
        p { color: #94A3B8; font-size: 0.875rem; margin-bottom: 1.5rem; }
        .btn { display: inline-block; padding: 0.75rem 2rem; background: #3B82F6; color: white; border-radius: 0.5rem; text-decoration: none; font-weight: 600; font-size: 0.875rem; transition: background 0.2s; }
        .btn:hover { background: #2563EB; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">TravelHub<span>.</span></div>
        <div class="icon">✅</div>
        <h1>Contraseña actualizada</h1>
        <p>Tu contraseña se cambió correctamente.</p>
        <a href="{% url 'login' %}" class="btn">Iniciar sesión</a>
    </div>
</body>
</html>

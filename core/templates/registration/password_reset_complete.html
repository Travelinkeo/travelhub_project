{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña actualizada | TravelHub</title>
    <script>
        var theme = localStorage.getItem('travelhub_theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'swiss' : 'obsidian');
        document.documentElement.setAttribute('data-theme', theme);
    </script>
    <link rel="stylesheet" href="{% static 'core/css/tailwind-built.css' %}">
    {% include "core/partials/_theme_engine.html" %}
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--surface-base); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
        .card { background: var(--surface-1); border: 1px solid var(--border-color); border-radius: 1rem; padding: 2.5rem; max-width: 420px; width: 100%; text-align: center; }
        .logo { font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem; color: var(--text-main); }
        .logo span { color: var(--primary); }
        .icon { font-size: 3rem; margin-bottom: 1rem; }
        h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
        p { color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 1.5rem; }
        .btn { display: inline-block; padding: 0.75rem 2rem; background: var(--primary); color: var(--text-on-primary); border-radius: 0.5rem; text-decoration: none; font-weight: 600; font-size: 0.875rem; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">TravelHub<span>.</span></div>
        <div class="icon">✅</div>
        <h1>Contraseña actualizada</h1>
        <p>Tu contraseña se cambió correctamente.</p>
        <a href="{% url 'login' %}" class="btn">Iniciar sesión</a>
    </div>
</body>
</html>

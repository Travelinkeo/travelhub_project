version: '3.9'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travelhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-celery:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_celery_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-evolution:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redis_evolution_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000 --noreload
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/travelhub
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_CACHE_URL=redis://redis-cache:6379/0
      - REDIS_SESSIONS_URL=redis://redis-cache:6379/1
      - REDIS_CELERY_URL=redis://redis-celery:6379/0
      - CELERY_BROKER_URL=redis://redis-celery:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-celery:6379/0
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
      - USE_CLOUDINARY=False
      - GOTENBERG_URL=http://gotenberg:3000/forms/chromium/convert/html
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-celery:
        condition: service_healthy
      gotenberg:
        condition: service_healthy

  celery:
    build: .
    command: celery -A travelhub worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/travelhub
      - REDIS_CELERY_URL=redis://redis-celery:6379/0
      - CELERY_BROKER_URL=redis://redis-celery:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-celery:6379/0
      - GOTENBERG_URL=http://gotenberg:3000/forms/chromium/convert/html
    depends_on:
      - db
      - redis-celery
      - gotenberg

  celery-beat:
    build: .
    command: celery -A travelhub beat -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/travelhub
      - REDIS_CELERY_URL=redis://redis-celery:6379/0
      - CELERY_BROKER_URL=redis://redis-celery:6379/0
    depends_on:
      - db
      - redis-celery

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution:
    image: atendai/evolution-api:latest
    ports:
      - "8080:8080"
    environment:
      # Server
      - SERVER_URL=http://localhost:8080
      # Database (REQUIRED for v2)
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      # 🔴 B3: parametrizado con defaults dev. En prod se sobreescriben via .env.
      - DATABASE_CONNECTION_URI=postgresql://${EVOLUTION_DB_USER:-postgres}:${EVOLUTION_DB_PASSWORD:-postgres}@evolution_db:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=travelhub
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      # Cache
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis-evolution:6379/0
      - CACHE_REDIS_PREFIX_KEY=travelhub_evolution
      # Authentication
      - AUTHENTICATION_API_KEY=travelhub-dev-key-change-in-production-2026
      # General
      - LANGUAGE=en
      - DEL_INSTANCE=false
    depends_on:
      redis-evolution:
        condition: service_healthy
      evolution_db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  evolution_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${EVOLUTION_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-postgres}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_cache_data:
  redis_celery_data:
  redis_evolution_data:
  evolution_pg_data:

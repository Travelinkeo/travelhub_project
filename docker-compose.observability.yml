version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: travelhub_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - observability_net
      - travelhub_private

  grafana:
    image: grafana/grafana:11.0.0
    container_name: travelhub_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/travelhub_overview.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning
      - ./ops/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - observability_net

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: travelhub_jaeger
    ports:
      - "16686:16686" # Frontend
      - "4317:4317"   # OTLP gRPC (OpenTelemetry)
      - "4318:4318"   # OTLP HTTP (OpenTelemetry)
    networks:
      - observability_net
      - travelhub_private


networks:
  observability_net:
    driver: bridge
  travelhub_private:
    external: true

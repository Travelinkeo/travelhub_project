services:
  # ---------------------------------------------------------------------------
  # 1. PROXY INVERSO Y CAPA SSL (Traefik)
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.0
    container_name: travelhub_proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik_data/letsencrypt:/letsencrypt
      - ./traefik_data/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik_data/dynamic.yml:/etc/traefik/dynamic.yml:ro
    environment:
      - MAIN_DOMAIN=${MAIN_DOMAIN}
      - SSL_ADMIN_EMAIL=${SSL_ADMIN_EMAIL}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    networks:
      - travelhub_public
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # 2. ETCD PARA PATRONI (Leader Election & Configuración)
  # ---------------------------------------------------------------------------
  etcd:
    image: bitnami/etcd:3.5
    container_name: travelhub_etcd
    restart: unless-stopped
    environment:
      - ETCD_NAME=etcd-0
      - ETCD_INITIAL_CLUSTER=etcd-0=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ALLOW_NONE_AUTHENTICATION=yes
    volumes:
      - etcd_data:/bitnami/etcd
    networks:
      - travelhub_private
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # ---------------------------------------------------------------------------
  # 3. CLUSTER POSTGRESQL CON PATRONI (3 Nodos: 1 Leader + 2 Replicas)
  # ---------------------------------------------------------------------------
  # Nodo 1 - Inicialmente Leader
  patroni-1:
    image: ghcr.io/zalando/postgres-operator:1.7.1-pg15
    container_name: travelhub_patroni_1
    restart: unless-stopped
    shm_size: 256mb
    environment:
      - SCOPE=travelhub
      - NAMESPACE=/patroni/
      - PATRONI_NAME=patroni-1
      - PATRONI_ETCD_HOSTS=etcd:2379
      - PATRONI_BOOTSTRAP_DCS_TTL=30
      - PATRONI_BOOTSTRAP_DCS_LOOP_WAIT=10
      - PATRONI_BOOTSTRAP_DCS_RETRY_TIMEOUT=10
      - PATRONI_BOOTSTRAP_DCS_MAXIMUM_LAG_ON_FAILOVER=1048576
      - PATRONI_BOOTSTRAP_DCS_SYNCHRONOUS_MODE=false
      - PATRONI_BOOTSTRAP_DCS_POSTGRESQL_PARAMETERS_MAX_CONNECTIONS=200
      - PATRONI_BOOTSTRAP_DCS_POSTGRESQL_PARAMETERS_SHARED_BUFFERS=256MB
      - PATRONI_BOOTSTRAP_DCS_POSTGRESQL_PARAMETERS_EFFECTIVE_CACHE_SIZE=1GB
      - PATRONI_BOOTSTRAP_DCS_POSTGRESQL_PARAMETERS_WORK_MEM=16MB
      - PATRONI_BOOTSTRAP_DCS_POSTGRESQL_PARAMETERS_MAINTENANCE_WORK_MEM=128MB
      - PATRONI_BOOTSTRAP_DCS_POSTGRESQL_PARAMETERS_RANDOM_PAGE_COST=1.1
      - PATRONI_BOOTSTRAP_DCS_POSTGRESQL_PARAMETERS_EFFECTIVE_IO_CONCURRENCY=200
      - PATRONI_BOOTSTRAP_DCS_POSTGRESQL_PARAMETERS_MAX_WORKER_PROCESSES=8
      - PATRONI_BOOTSTRAP_DCS_POSTGRESQL_PARAMETERS_MAX_PARALLEL_WORKERS_PER_GATHER=4
      - PATRONI_BOOTSTRAP_DCS_POSTGRESQL_PARAMETERS_MAX_PARALLEL_WORKERS=8
      - PATRONI_BOOTSTRAP_DCS_POSTGRESQL_PARAMETERS_WAL_LEVEL=replica
      - PATRONI_BOOTSTRAP_DCS_POSTGRESQL_PARAMETERS_MAX_WAL_SENDERS=10
      - PATRONI_BOOTSTRAP_DCS_POSTGRESQL_PARAMETERS_MAX_REPLICATION_SLOTS=10
      - PATRONI_BOOTSTRAP_DCS_POSTGRESQL_PARAMETERS_HOT_STANDBY=on
      - PATRONI_BOOTSTRAP_DCS_POSTGRESQL_PARAMETERS_HOT_STANDBY_FEEDBACK=on
      - PATRONI_POSTGRESQL_CONNECT_ADDRESS=patroni-1:5432
      - PATRONI_RESTAPI_CONNECT_ADDRESS=patroni-1:8008
      - PATRONI_RESTAPI_LISTEN=0.0.0.0:8008
      - PATRONI_RESTAPI_AUTH=patroni:patroni
      - PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_PASSWORD=${DB_PASSWORD}
      - PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD=${DB_PASSWORD}
      - PATRONI_POSTGRESQL_PARAMETERS_MAX_CONNECTIONS=200
      - PATRONI_POSTGRESQL_PARAMETERS_SHARED_BUFFERS=256MB
      - PATRONI_POSTGRESQL_PARAMETERS_EFFECTIVE_CACHE_SIZE=1GB
      - PATRONI_POSTGRESQL_PARAMETERS_WORK_MEM=16MB
      - PATRONI_POSTGRESQL_PARAMETERS_MAINTENANCE_WORK_MEM=128MB
      - PATRONI_POSTGRESQL_PARAMETERS_RANDOM_PAGE_COST=1.1
      - PATRONI_POSTGRESQL_PARAMETERS_EFFECTIVE_IO_CONCURRENCY=200
      - PATRONI_POSTGRESQL_PARAMETERS_MAX_WORKER_PROCESSES=8
      - PATRONI_POSTGRESQL_PARAMETERS_MAX_PARALLEL_WORKERS_PER_GATHER=4
      - PATRONI_POSTGRESQL_PARAMETERS_MAX_PARALLEL_WORKERS=8
      - PATRONI_POSTGRESQL_PARAMETERS_WAL_LEVEL=replica
      - PATRONI_POSTGRESQL_PARAMETERS_MAX_WAL_SENDERS=10
      - PATRONI_POSTGRESQL_PARAMETERS_MAX_REPLICATION_SLOTS=10
      - PATRONI_POSTGRESQL_PARAMETERS_HOT_STANDBY=on
      - PATRONI_POSTGRESQL_PARAMETERS_HOT_STANDBY_FEEDBACK=on
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - patroni1_data:/home/postgres/pgdata
    networks:
      - travelhub_private
    healthcheck:
      test: ["CMD", "patronictl", "list", "-f", "json"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  # Nodo 2 - Replica
  patroni-2:
    image: ghcr.io/zalando/postgres-operator:1.7.1-pg15
    container_name: travelhub_patroni_2
    restart: unless-stopped
    shm_size: 256mb
    environment:
      - SCOPE=travelhub
      - NAMESPACE=/patroni/
      - PATRONI_NAME=patroni-2
      - PATRONI_ETCD_HOSTS=etcd:2379
      - PATRONI_BOOTSTRAP_DCS_TTL=30
      - PATRONI_BOOTSTRAP_DCS_LOOP_WAIT=10
      - PATRONI_BOOTSTRAP_DCS_RETRY_TIMEOUT=10
      - PATRONI_BOOTSTRAP_DCS_MAXIMUM_LAG_ON_FAILOVER=1048576
      - PATRONI_BOOTSTRAP_DCS_SYNCHRONOUS_MODE=false
      - PATRONI_POSTGRESQL_CONNECT_ADDRESS=patroni-2:5432
      - PATRONI_RESTAPI_CONNECT_ADDRESS=patroni-2:8008
      - PATRONI_RESTAPI_LISTEN=0.0.0.0:8008
      - PATRONI_RESTAPI_AUTH=patroni:patroni
      - PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_PASSWORD=${DB_PASSWORD}
      - PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - patroni2_data:/home/postgres/pgdata
    networks:
      - travelhub_private
    healthcheck:
      test: ["CMD", "patronictl", "list", "-f", "json"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  # Nodo 3 - Replica
  patroni-3:
    image: ghcr.io/zalando/postgres-operator:1.7.1-pg15
    container_name: travelhub_patroni_3
    restart: unless-stopped
    shm_size: 256mb
    environment:
      - SCOPE=travelhub
      - NAMESPACE=/patroni/
      - PATRONI_NAME=patroni-3
      - PATRONI_ETCD_HOSTS=etcd:2379
      - PATRONI_BOOTSTRAP_DCS_TTL=30
      - PATRONI_BOOTSTRAP_DCS_LOOP_WAIT=10
      - PATRONI_BOOTSTRAP_DCS_RETRY_TIMEOUT=10
      - PATRONI_BOOTSTRAP_DCS_MAXIMUM_LAG_ON_FAILOVER=1048576
      - PATRONI_POSTGRESQL_CONNECT_ADDRESS=patroni-3:5432
      - PATRONI_RESTAPI_CONNECT_ADDRESS=patroni-3:8008
      - PATRONI_RESTAPI_LISTEN=0.0.0.0:8008
      - PATRONI_RESTAPI_AUTH=patroni:patroni
      - PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_PASSWORD=${DB_PASSWORD}
      - PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - patroni3_data:/home/postgres/pgdata
    networks:
      - travelhub_private
    healthcheck:
      test: ["CMD", "patronictl", "list", "-f", "json"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  # ---------------------------------------------------------------------------
  # 3. BROKER DE MENSAJERÍA Y CACHE (Redis - Split into 4 instances)
  # ---------------------------------------------------------------------------
  # 3a. Redis Cache + Sessions (Django cache DB 0, Sessions DB 1)
  redis-cache:
    image: redis:7-alpine
    container_name: travelhub_redis_cache
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_cache_data:/data
    networks:
      - travelhub_private
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # 3b. Redis Celery (Broker + Results DB 0)
  redis-celery:
    image: redis:7-alpine
    container_name: travelhub_redis_celery
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_celery_data:/data
    networks:
      - travelhub_private
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # 3c. Redis Evolution (WhatsApp cache DB 0)
  redis-evolution:
    image: redis:7-alpine
    container_name: travelhub_redis_evolution
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_evolution_data:/data
    networks:
      - travelhub_private
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # ---------------------------------------------------------------------------
  # 3.5. CONNECTION POOLER (PgBouncer) - Conecta a Patroni
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: travelhub_pooler
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@patroni-1:5432/${DB_NAME}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 25
      SERVER_IDLE_TIMEOUT: 600
      AUTH_TYPE: scram-sha-256
      SERVER_RESET_QUERY: DISCARD ALL
      SERVER_CHECK_QUERY: SELECT 1
      SERVER_CHECK_DELAY: 30
      SERVER_LIFETIME: 3600
      SERVER_CONNECT_TIMEOUT: 15
      SERVER_LOGIN_RETRY: 15
      SERVER_MAXWAIT: 120
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    networks:
      - travelhub_private
    depends_on:
      patroni-1:
        condition: service_healthy
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h patroni-1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # 4. EL MONOLITO MODULAR (Django Application Server)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelhub_web
    restart: unless-stopped
    command: >
      sh -c "gunicorn travelhub.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --max-requests 1000 --timeout 120"
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@pgbouncer:5432/${DB_NAME}
      - REDIS_CACHE_URL=redis://:${REDIS_PASSWORD}@redis-cache:6379/0
      - REDIS_SESSIONS_URL=redis://:${REDIS_PASSWORD}@redis-cache:6379/1
      - REDIS_CELERY_URL=redis://:${REDIS_PASSWORD}@redis-celery:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis-celery:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis-celery:6379/0
    env_file:
      - .env.production
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-celery:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); r=s.connect_ex(('127.0.0.1', 8000)); s.close(); exit(0 if r==0 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.travelhub.rule=Host(`${MAIN_DOMAIN}`) || HostRegexp(`{subdomain:[a-z0-9-]+}.${MAIN_DOMAIN}`)"
      - "traefik.http.routers.travelhub.entrypoints=websecure"
      - "traefik.http.routers.travelhub.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.travelhub.loadbalancer.server.port=8000"
    networks:
      - travelhub_public
      - travelhub_private
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  # ---------------------------------------------------------------------------
  # 5. SERVIDOR DE ARCHIVOS ESTÁTICOS Y MEDIA (Nginx)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: travelhub_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.travelhub-static.rule=(Host(`${MAIN_DOMAIN}`) || HostRegexp(`{subdomain:[a-z0-9-]+}.${MAIN_DOMAIN}`)) && (PathPrefix(`/media`) || PathPrefix(`/static`))"
      - "traefik.http.routers.travelhub-static.entrypoints=websecure"
      - "traefik.http.routers.travelhub-static.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.travelhub-static.priority=100"
      - "traefik.http.services.travelhub-static.loadbalancer.server.port=80"
    networks:
      - travelhub_public
      - travelhub_private
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # 6. GENERADOR DE PDF (Gotenberg)
  # ---------------------------------------------------------------------------
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: travelhub_gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-routes=false"
      - "--api-timeout=120s"
    healthcheck:
      test: ["CMD", "gotenberg", "--help"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - travelhub_private
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ---------------------------------------------------------------------------
  # 7. WORKER ASÍNCRONO (Celery - PNR Parsing, Telegram, WhatsApp Webhooks)
  # ---------------------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelhub_worker
    restart: unless-stopped
    command: celery -A travelhub worker --loglevel=info -Q default,notifications,ia_fast,celery --concurrency=4 --max-tasks-per-child=1000 --max-memory-per-child=512000
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@pgbouncer:5432/${DB_NAME}
      - REDIS_CELERY_URL=redis://:${REDIS_PASSWORD}@redis-celery:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis-celery:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis-celery:6379/0
    volumes:
      - media_volume:/app/media
    depends_on:
      redis-celery:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 60s
    networks:
      - travelhub_private
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  # ---------------------------------------------------------------------------
  # 8. PROGRAMADOR PERIÓDICO (Celery Beat - Guardián de Tiempos Límite)
  # ---------------------------------------------------------------------------
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelhub_beat
    restart: unless-stopped
    command: celery -A travelhub beat --loglevel=info
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@pgbouncer:5432/${DB_NAME}
      - REDIS_CELERY_URL=redis://:${REDIS_PASSWORD}@redis-celery:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis-celery:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis-celery:6379/0
    depends_on:
      redis-celery:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - travelhub_private
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # 9. WHATSAPP MICROSERVICE (Evolution API v2)
  # ---------------------------------------------------------------------------
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: travelhub_evolution
    restart: unless-stopped
    volumes:
      - evolution_data:/evolution/instances
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${WHATSAPP_MICROSERVICE_TOKEN}
      - LANGUAGE=es
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution@evolution_db:5432/evolution_v2?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=travelhub
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD}@redis-evolution:6379/0
      - CACHE_REDIS_PREFIX_KEY=travelhub_evolution
      - LOG_LEVEL=INFO
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1041831138
      - WEB_VERSION=2.3000.1041831138
    depends_on:
      redis-evolution:
        condition: service_healthy
      evolution_db:
        condition: service_healthy
    networks:
      - travelhub_private
      - travelhub_public
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  evolution_db:
    image: postgres:15-alpine
    container_name: travelhub_evolution_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution
      - POSTGRES_DB=evolution_v2
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    networks:
      - travelhub_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution_v2"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

# ---------------------------------------------------------------------------
# AISLAMIENTO SEGURO DE REDES Y VOLÚMENES PERSISTENTES
# ---------------------------------------------------------------------------
networks:
  travelhub_public:
    name: travelhub_public
  travelhub_private:
    name: travelhub_private

volumes:
  postgres_data:
    name: travelhub_postgres_data
  redis_cache_data:
    name: travelhub_redis_cache_data
  redis_celery_data:
    name: travelhub_redis_celery_data
  redis_evolution_data:
    name: travelhub_redis_evolution_data
  static_volume:
    name: travelhub_static_volume
  media_volume:
    name: travelhub_media_volume
  evolution_data:
    name: travelhub_evolution_data
  evolution_db_data:
    name: travelhub_evolution_db_data

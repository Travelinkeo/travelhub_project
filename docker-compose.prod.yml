services:
  # ---------------------------------------------------------------------------
  # 1. PROXY INVERSO Y CAPA SSL (Traefik)
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.0
    container_name: travelhub_proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik_data/letsencrypt:/letsencrypt
      - ./traefik_data/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik_data/dynamic.yml:/etc/traefik/dynamic.yml:ro
    environment:
      - MAIN_DOMAIN=${MAIN_DOMAIN}
      - SSL_ADMIN_EMAIL=${SSL_ADMIN_EMAIL}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    networks:
      - travelhub_public
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # 2. MOTOR DE BASE DE DATOS (PostgreSQL)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: travelhub_db
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - travelhub_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  # ---------------------------------------------------------------------------
  # 3. BROKER DE MENSAJERÍA Y CACHE (Redis)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: travelhub_broker
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - travelhub_private
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # 4. EL MONOLITO MODULAR (Django Application Server)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelhub_web
    restart: unless-stopped
    command: >
      sh -c "gunicorn travelhub.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --max-requests 1000 --timeout 120"
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
    env_file:
      - .env.production
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.travelhub.rule=Host(`${MAIN_DOMAIN}`) || HostRegexp(`{subdomain:[a-z0-9-]+}.${MAIN_DOMAIN}`)"
      - "traefik.http.routers.travelhub.entrypoints=websecure"
      - "traefik.http.routers.travelhub.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.travelhub.loadbalancer.server.port=8000"
    networks:
      - travelhub_public
      - travelhub_private
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  # ---------------------------------------------------------------------------
  # 5. SERVIDOR DE ARCHIVOS ESTÁTICOS Y MEDIA (Nginx)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: travelhub_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.travelhub-static.rule=(Host(`${MAIN_DOMAIN}`) || HostRegexp(`{subdomain:[a-z0-9-]+}.${MAIN_DOMAIN}`)) && (PathPrefix(`/media`) || PathPrefix(`/static`))"
      - "traefik.http.routers.travelhub-static.entrypoints=websecure"
      - "traefik.http.routers.travelhub-static.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.travelhub-static.priority=100"
      - "traefik.http.services.travelhub-static.loadbalancer.server.port=80"
    networks:
      - travelhub_public
      - travelhub_private
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # 6. GENERADOR DE PDF (Gotenberg)
  # ---------------------------------------------------------------------------
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: travelhub_gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-routes=false"
      - "--api-timeout=120s"
    healthcheck:
      test: ["CMD", "gotenberg", "--help"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - travelhub_private
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ---------------------------------------------------------------------------
  # 7. WORKER ASÍNCRONO (Celery - PNR Parsing, Telegram, WhatsApp Webhooks)
  # ---------------------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelhub_worker
    restart: unless-stopped
    command: celery -A travelhub worker --loglevel=info -Q default,notifications,ia_fast,celery --concurrency=4 --max-tasks-per-child=1000 --max-memory-per-child=512000
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - media_volume:/app/media
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A travelhub inspect ping --timeout 10 || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    networks:
      - travelhub_private
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  # ---------------------------------------------------------------------------
  # 8. PROGRAMADOR PERIÓDICO (Celery Beat - Guardián de Tiempos Límite)
  # ---------------------------------------------------------------------------
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelhub_beat
    restart: unless-stopped
    command: celery -A travelhub beat --loglevel=info
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep 'celery beat' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - travelhub_private
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # 9. WHATSAPP MICROSERVICE (Evolution API v2)
  # ---------------------------------------------------------------------------
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: travelhub_evolution
    restart: unless-stopped
    volumes:
      - evolution_data:/evolution/instances
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${WHATSAPP_MICROSERVICE_TOKEN}
      - LANGUAGE=es
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution@evolution_db:5432/evolution_v2?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=travelhub
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=travelhub_evolution
      - LOG_LEVEL=INFO
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1041831138
      - WEB_VERSION=2.3000.1041831138
    depends_on:
      redis:
        condition: service_healthy
      evolution_db:
        condition: service_healthy
    networks:
      - travelhub_private
      - travelhub_public
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  evolution_db:
    image: postgres:15-alpine
    container_name: travelhub_evolution_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution
      - POSTGRES_DB=evolution_v2
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    networks:
      - travelhub_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution_v2"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

# ---------------------------------------------------------------------------
# AISLAMIENTO SEGURO DE REDES Y VOLÚMENES PERSISTENTES
# ---------------------------------------------------------------------------
networks:
  travelhub_public:
    name: travelhub_public
  travelhub_private:
    name: travelhub_private

volumes:
  postgres_data:
    name: travelhub_postgres_data
  redis_data:
    name: travelhub_redis_data
  static_volume:
    name: travelhub_static_volume
  media_volume:
    name: travelhub_media_volume
  evolution_data:
    name: travelhub_evolution_data
  evolution_db_data:
    name: travelhub_evolution_db_data

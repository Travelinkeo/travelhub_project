services:
  test_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travelhub_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  test_redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: test
    environment:
      DJANGO_SETTINGS_MODULE: travelhub.settings
      DATABASE_URL: postgresql://postgres:postgres@test_db:5432/travelhub_test
      CELERY_BROKER_URL: redis://test_redis:6379/0
      SECRET_KEY: test-secret-key-for-ci-only-123456789012345678901234567890
      ENCRYPTION_KEY: test-encryption-key-32-chars-long!!
      DEBUG: "True"
      ENVIRONMENT: test
      REDIS_HOST: test_redis
      REDIS_PORT: 6379
    depends_on:
      test_db:
        condition: service_healthy
      test_redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m pytest tests/ -x -q --tb=short --create-db"

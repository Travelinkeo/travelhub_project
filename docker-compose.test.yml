services:
  test_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travelhub_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  test_redis_cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  test_redis_celery:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: test
    environment:
      DJANGO_SETTINGS_MODULE: travelhub.settings.testing
      DATABASE_URL: postgresql://postgres:postgres@test_db:5432/travelhub_test
      POSTGRES_HOST: test_db
      POSTGRES_PORT: "5432"
      REDIS_CACHE_URL: redis://test_redis_cache:6379/0
      REDIS_SESSIONS_URL: redis://test_redis_cache:6379/1
      REDIS_CELERY_URL: redis://test_redis_celery:6379/0
      CELERY_BROKER_URL: redis://test_redis_celery:6379/0
      CELERY_RESULT_BACKEND: redis://test_redis_celery:6379/0
      SECRET_KEY: test-secret-key-for-ci-only-123456789012345678901234567890
      ENCRYPTION_KEY: test-encryption-key-32-chars-long!!
      DEBUG: "True"
      ENVIRONMENT: test
      TESTING: "True"
      CI: "true"
    depends_on:
      test_db:
        condition: service_healthy
      test_redis_cache:
        condition: service_healthy
      test_redis_celery:
        condition: service_healthy
    command: >
      sh -c "python -m pytest tests/ -x -q --tb=short --create-db --no-header"

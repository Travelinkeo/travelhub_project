version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travelhub_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             pytest tests/ --cov=. --cov-report=term-missing -v --create-db"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/travelhub_test
      CELERY_BROKER_URL: redis://redis:6379/0
      SECRET_KEY: test-secret-key-for-ci-only-123456789012345678901234567890
      DEBUG: 'True'
      ENCRYPTION_KEY: test-encryption-key-32-chars-long!!
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # 1. PROXY INVERSO Y CAPA SSL (Traefik)
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.0
    container_name: travelhub_proxy
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik_data/letsencrypt:/letsencrypt
      - ./traefik_data/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik_data/dynamic.yml:/etc/traefik/dynamic.yml:ro
    environment:
      - MAIN_DOMAIN=${MAIN_DOMAIN}
      - SSL_ADMIN_EMAIL=${SSL_ADMIN_EMAIL}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    networks:
      - travelhub_public
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # 2. MOTOR DE BASE DE DATOS (PostgreSQL)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: travelhub_db
    restart: unless-stopped
    logging: *default-logging
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # SECURITY: Puerto de BD comentado - solo accesible via red Docker interna
    # Para acceso local durante desarrollo, descomentar temporalmente:
    # ports:
    #   - "5433:5432"
    networks:
      - travelhub_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  # ---------------------------------------------------------------------------
  # 2.5. CONNECTION POOLER (PgBouncer)
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: travelhub_pooler
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 25
      SERVER_IDLE_TIMEOUT: 600
      AUTH_TYPE: scram-sha-256
    networks:
      - travelhub_private
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # 3. BROKER DE MENSAJERÍA Y CACHE (Redis)
  # ---------------------------------------------------------------------------
  # Redis principal - Cache (DB 0)
  redis_cache:
    image: redis:7-alpine
    container_name: travelhub_redis_cache
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?}
    volumes:
      - redis_cache_data:/data
    networks:
      - travelhub_private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'

  # Redis - Celery Broker (DB 1)
  redis_broker:
    image: redis:7-alpine
    container_name: travelhub_redis_broker
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?}
    volumes:
      - redis_broker_data:/data
    networks:
      - travelhub_private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'

  # Redis - Evolution API (DB 2)
  redis_evolution:
    image: redis:7-alpine
    container_name: travelhub_redis_evolution
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?}
    volumes:
      - redis_evolution_data:/data
    networks:
      - travelhub_private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # 4. EL MONOLITO MODULAR (Django Application Server)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: travelhub_web
    restart: unless-stopped
    logging: *default-logging
    command: gunicorn travelhub.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-4} --worker-class sync --max-requests 1000 --max-requests-jitter 100 --timeout 120 --keep-alive 5
    # SECURITY: Puerto de Gunicorn comentado - solo accesible via Traefik
    # Para acceso local durante desarrollo, descomentar temporalmente:
    #ports:
    #  - "8000:8000"
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@pgbouncer:5432/${DB_NAME}
      - REDIS_URL=redis://redis_cache:6379/0
      # CELERY_BROKER_URL / CELERY_RESULT_BACKEND se construyen en
      # travelhub/settings/base.py via build_redis_url() con REDIS_PASSWORD
      # (no inyectar aqui: sin password -> "Authentication required" contra
      # redis con requirepass)
      # Settings module explícito — producción
      - DJANGO_SETTINGS_MODULE=travelhub.settings.production
      - DJANGO_ENV=production
      # OTEL habilitado con exporter HTTP (compatible Python 3.12 — fix: pkg_resources eliminado)
      - ENABLE_TELEMETRY=True
      - OTLP_ENDPOINT=http://jaeger:4318
      - SERVICE_NAME=travelhub-backend
      - OTEL_PYTHON_DISABLED_INSTRUMENTATIONS=none
    env_file:
      - .env.local
    volumes:
      - static_volume:/app/staticfiles
      - ./media:/app/media
      - ./boletos_importados:/app/boletos_importados
      - ./apps:/app/apps
      - ./core:/app/core
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis_cache:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 60s
      retries: 10
      start_period: 300s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.travelhub.rule=Host(`${MAIN_DOMAIN}`) || HostRegexp(`{subdomain:[a-z0-9-]+}.${MAIN_DOMAIN}`)"
      - "traefik.http.routers.travelhub.entrypoints=websecure"
      - "traefik.http.routers.travelhub.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.travelhub.loadbalancer.server.port=8000"
    networks:
      - travelhub_public
      - travelhub_private
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  # ---------------------------------------------------------------------------
  # 5. SERVIDOR DE ARCHIVOS ESTÁTICOS Y MEDIA (Nginx)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: travelhub_nginx
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health/metrics/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.travelhub-static.rule=(Host(`${MAIN_DOMAIN}`) || HostRegexp(`{subdomain:[a-z0-9-]+}.${MAIN_DOMAIN}`)) && (PathPrefix(`/media`) || PathPrefix(`/static`))"
      - "traefik.http.routers.travelhub-static.entrypoints=web,websecure"
      - "traefik.http.routers.travelhub-static.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.travelhub-static.priority=100"
      - "traefik.http.services.travelhub-static.loadbalancer.server.port=80"
    networks:
      - travelhub_public
      - travelhub_private
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # 6. TRACING DISTRIBUIDO (Jaeger — OpenTelemetry backend)
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: travelhub_jaeger
    restart: unless-stopped
    logging: *default-logging
    # SECURITY: Jaeger UI solo accesible via red interna
    # Descomentar para depuración local:
    #ports:
    #  - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
    #ports:
    #  - "16686:16686"   # UI: http://localhost:16686
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - travelhub_private
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'


  # ---------------------------------------------------------------------------
  # 7. WORKER ASÍNCRONO (Celery - PNR Parsing, Telegram, WhatsApp Webhooks)
  # ---------------------------------------------------------------------------

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: travelhub_worker
    restart: unless-stopped
    logging: *default-logging
    command: celery -A travelhub worker --loglevel=info -Q celery --concurrency=2 --max-tasks-per-child=1000 --max-memory-per-child=256000
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@pgbouncer:5432/${DB_NAME}
      - REDIS_URL=redis://redis_cache:6379/0
      # CELERY_BROKER_URL / CELERY_RESULT_BACKEND se construyen en
      # travelhub/settings/base.py via build_redis_url() con REDIS_PASSWORD
      # (no inyectar aqui: sin password -> "Authentication required" contra
      # redis con requirepass)
    volumes:
      - ./media:/app/media
      - ./boletos_importados:/app/boletos_importados
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis_cache:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A travelhub inspect ping --timeout 30 || exit 1"]
      interval: 60s
      timeout: 120s
      retries: 5
      start_period: 300s
    networks:
      - travelhub_private
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  celery_notifications:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: travelhub_notifications
    restart: unless-stopped
    logging: *default-logging
    command: celery -A travelhub worker --loglevel=info -Q notifications --concurrency=1 --max-tasks-per-child=1000 --max-memory-per-child=256000
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@pgbouncer:5432/${DB_NAME}
      - REDIS_URL=redis://redis_cache:6379/0
      # CELERY_BROKER_URL / CELERY_RESULT_BACKEND se construyen en
      # travelhub/settings/base.py via build_redis_url() con REDIS_PASSWORD
      # (no inyectar aqui: sin password -> "Authentication required" contra
      # redis con requirepass)
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis_cache:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A travelhub inspect ping --timeout 30 || exit 1"]
      interval: 60s
      timeout: 120s
      retries: 5
      start_period: 300s
    networks:
      - travelhub_private
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'


  # ---------------------------------------------------------------------------
  # 8. PROGRAMADOR PERIÓDICO (Celery Beat - Guardián de Tiempos Límite)
  # ---------------------------------------------------------------------------
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: travelhub_beat
    restart: unless-stopped
    logging: *default-logging
    command: celery -A travelhub beat --loglevel=info
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@pgbouncer:5432/${DB_NAME}
      - REDIS_URL=redis://redis_cache:6379/0
      # CELERY_BROKER_URL / CELERY_RESULT_BACKEND se construyen en
      # travelhub/settings/base.py via build_redis_url() con REDIS_PASSWORD
      # (no inyectar aqui: sin password -> "Authentication required" contra
      # redis con requirepass)
    depends_on:
      pgbouncer:
        condition: service_started
      redis_cache:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; query = 'beat'; pids = [pid for pid in os.listdir('/proc') if pid.isdigit() and int(pid) != os.getpid()]; cmds = [open(f'/proc/{pid}/cmdline').read() for pid in pids if os.path.exists(f'/proc/{pid}/cmdline')]; assert any(query in cmd for cmd in cmds)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - travelhub_private
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # 9. WHATSAPP MICROSERVICE (Evolution API v2)
  # ---------------------------------------------------------------------------
  evolution:
    image: atendai/evolution-api:latest
    container_name: travelhub_evolution
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - evolution_data:/evolution/instances
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://evolution:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${WHATSAPP_MICROSERVICE_TOKEN}
      - LANGUAGE=es
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      # 🔴 B3: parametrizado desde ${EVOLUTION_DB_USER}/${EVOLUTION_DB_PASSWORD} (obligatorio).
      # Sin defaults — compose aborta si no estan definidas.
      - DATABASE_CONNECTION_URI=postgresql://${EVOLUTION_DB_USER:-evolution}:${EVOLUTION_DB_PASSWORD:-evolution}@evolution_db:5432/evolution_v2?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=travelhub
      - DATABASE_SAVE_DATA_INSTANCE=true
      - QRCODE_LIMIT=30
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis_evolution:6379/0
      - CACHE_REDIS_PREFIX_KEY=travelhub_evolution
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1035194821
      - LOG_LEVEL=INFO
      - LOG_BAILEYS=debug
    depends_on:
      redis_evolution:
        condition: service_healthy
      evolution_db:
        condition: service_healthy
    networks:
      - travelhub_private
      - travelhub_public
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  evolution_db:
    image: postgres:15-alpine
    container_name: travelhub_evolution_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      - POSTGRES_USER=${EVOLUTION_DB_USER:?}
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD:?}
      - POSTGRES_DB=evolution_v2
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    networks:
      - travelhub_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_DB_USER:?} -d evolution_v2"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

# ---------------------------------------------------------------------------
# AISLAMIENTO SEGURO DE REDES Y VOLÚMENES PERSISTENTES
# ---------------------------------------------------------------------------
networks:
  travelhub_public:
    name: travelhub_public
  travelhub_private:
    name: travelhub_private

volumes:
  postgres_data:
    external: true
    name: travelhub_project_postgres_data
  redis_cache_data:
    external: true
    name: travelhub_redis_cache_data
  redis_broker_data:
    external: true
    name: travelhub_redis_broker_data
  redis_evolution_data:
    external: true
    name: travelhub_redis_evolution_data
  static_volume:
    external: true
    name: travelhub_static_volume
  evolution_data:
    external: true
    name: travelhub_project_evolution_data
  evolution_db_data:
    external: true
    name: travelhub_project_evolution_db_data

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-celery-worker
  labels:
    app: {{ .Release.Name }}-celery-worker
spec:
  replicas: {{ .Values.celery.worker.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-celery-worker
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-celery-worker
    spec:
      containers:
        - name: {{ .Chart.Name }}-celery-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command: ["celery", "-A", "travelhub", "worker", "-l", "INFO", "-Q", "celery,notifications,ia_heavy", "--concurrency=4", "--max-tasks-per-child=1000", "--max-memory-per-child=512000"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-secrets
          livenessProbe:
            exec:
              command: ["sh", "-c", "celery -A travelhub inspect ping --destination=celery@$(hostname) --timeout=10 || exit 1"]
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "celery -A travelhub inspect ping --destination=celery@$(hostname) --timeout=5 || exit 1"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

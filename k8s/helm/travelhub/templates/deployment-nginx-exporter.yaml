apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nginx-exporter
  labels:
    app: {{ .Release.Name }}-nginx-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-nginx-exporter
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-nginx-exporter
    spec:
      containers:
        - name: nginx-exporter
          image: "{{ .Values.exporters.nginx.image }}"
          args:
            - "--nginx.scrape-uri=http://nginx:80/stub_status"
          ports:
            - containerPort: 9113
          resources:
            {{- toYaml .Values.exporters.nginx.resources | nindent 12 }}

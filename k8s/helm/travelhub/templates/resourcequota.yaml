apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ .Release.Name }}-quota
  labels:
    app: {{ .Release.Name }}
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    requests.storage: 50Gi
    persistentvolumeclaims: "10"
    services: "10"
    secrets: "20"
    configmaps: "20"
    pods: "20"
    replicationcontrollers: "10"
    services.loadbalancers: "2"
    services.nodeports: "0"
    cpu: "4"
    memory: "8Gi"
    ephemeral-storage: "10Gi"

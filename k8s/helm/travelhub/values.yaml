# Default values for travelhub.
replicaCount: 2

image:
  repository: myregistry/travelhub
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: app.travelhub.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: travelhub-tls
      hosts:
        - app.travelhub.com

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

celery:
  worker:
    replicaCount: 2
  beat:
    replicaCount: 1

env:
  DEBUG: "False"
  # Add other environments variable references through Secrets or ConfigMaps

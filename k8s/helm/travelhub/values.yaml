# Default values for travelhub.
# Sobreescribir en producción con: helm upgrade --set image.tag=v1.2.3 ...

replicaCount: 2

image:
  repository: ghcr.io/Travelinkeo/travelhub_project
  pullPolicy: IfNotPresent
  tag: "v1.0.0"  # Usar semver tag, no "latest"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
  hosts:
    - host: app.travelhub.cc
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: travelhub-tls
      hosts:
        - app.travelhub.cc

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

# --- Autoescalado Horizontal (HPA) ---
autoscaling:
  enabled: true

  # Web (Gunicorn/Django)
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

  # Celery Workers (independiente del web)
  celery:
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 80

# --- Probes de salud ---
probes:
  liveness:
    path: /health/
    initialDelaySeconds: 45
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    path: /health/
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3

# --- Workers Celery ---
celery:
  worker:
    replicaCount: 2
    resources:
      limits:
        cpu: 1000m
        memory: 1024Mi
      requests:
        cpu: 200m
        memory: 384Mi
    queue: "celery,notifications,ia_heavy"
    concurrency: 4
    maxTasksPerChild: 1000
    maxMemoryPerChild: 512000
  beat:
    replicaCount: 1   # Beat SIEMPRE 1 réplica (scheduler no puede duplicarse)

# --- Exporters para Prometheus ---
exporters:
  redis:
    enabled: true
    image: oliver006/redis_exporter:v1.61.0
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
  postgres:
    enabled: true
    image: prometheuscommunity/postgres-exporter:v0.15.0
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
  nginx:
    enabled: true
    image: nginx/nginx-prometheus-exporter:1.3.0
    resources:
      limits:
        cpu: 50m
        memory: 64Mi
  node:
    enabled: true
    image: prometheus/node-exporter:v1.8.2
    resources:
      limits:
        cpu: 100m
        memory: 128Mi

# --- Variables de entorno (el resto via Secret) ---
env:
  DEBUG: "False"
  GUNICORN_WORKERS: "4"
  ENABLE_TELEMETRY: "True"
  OTLP_ENDPOINT: "http://jaeger:4318"

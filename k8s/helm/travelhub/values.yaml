# Default values for travelhub.
# Sobreescribir en producción con: helm upgrade --set image.tag=abc123 ...

replicaCount: 2

image:
  repository: myregistry/travelhub
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
  hosts:
    - host: app.travelhub.cc
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: travelhub-tls
      hosts:
        - app.travelhub.cc

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

# --- Autoescalado Horizontal (HPA) ---
autoscaling:
  enabled: true

  # Web (Gunicorn/Django)
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

  # Celery Workers (independiente del web)
  celery:
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 80

# --- Probes de salud ---
probes:
  liveness:
    path: /health/
    initialDelaySeconds: 45
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    path: /health/
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3

# --- Workers Celery ---
celery:
  worker:
    replicaCount: 2
    resources:
      limits:
        cpu: 1000m
        memory: 1024Mi
      requests:
        cpu: 200m
        memory: 384Mi
  beat:
    replicaCount: 1   # Beat SIEMPRE 1 réplica (scheduler no puede duplicarse)

# --- Variables de entorno (el resto via Secret) ---
env:
  DEBUG: "False"
  GUNICORN_WORKERS: "4"
  ENABLE_TELEMETRY: "True"
  OTLP_ENDPOINT: "http://jaeger:4318"

[mypy]
python_version = 3.13
# strict = False es intencional durante la fase de adopcion gradual.
# Se va activando checkeo estricto por modulo en [[mypy-overrides]] a medida
# que se tipan las apps (ver docs/MYPY.md).
# NO desactivar los error_codes de abajo sin justificacion: cada uno debilita
# la senal estatica que mypy aporta. Reactivarlos progresivamente conforme se
# tipen las apps afectadas.
strict = False
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
show_error_codes = True
ignore_missing_imports = True
# Error codes temporalmente desactivados durante adopcion gradual.
# Tracker: remover uno por uno al tipar las apps afectadas.
disable_error_code = no-untyped-def,no-untyped-call,arg-type,assignment,truthy-function
# Django
plugins = mypy_django_plugin.main

# --- Adopcion gradual: modulos ya tipados con checkeo estricto ---
# Para anadir un modulo, copiar el bloque [mypy-app.X.Y] de abajo y
# listar el modulo (sin el .py). mypy aplicara strict=True solo a esos.
[mypy-apps.common.models]
strict = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
no_implicit_optional = True

[mypy-apps.common.services.circuit_breaker]
strict = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
no_implicit_optional = True

[mypy.plugins.django-stubs]
django_settings_module = travelhub.settings

# Ignorar librerías sin stubs
[mypy-rest_framework.*]
ignore_missing_imports = True

[mypy-django_filters.*]
ignore_missing_imports = True

[mypy-weasyprint.*]
ignore_missing_imports = True

[mypy-fitz.*]
ignore_missing_imports = True

[mypy-twilio.*]
ignore_missing_imports = True

[mypy-apps.common.services.bi_service]
strict = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
no_implicit_optional = True

[mypy-apps.common.services.catalog_service]
strict = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
no_implicit_optional = True

# celery_utils.py: dejelo en strict=False global (no override strict).
# El modulo depende de stubs celery explicitos y mypy >= 1.18 para resolver
# @shared_task + .delay/.name/.apply_async correctamente. Sin esos, mypy emite
# #[attr-defined] y #[untyped-decorator] de todas formas aunque strict=False
# global. Se desactivan temporalmente por modulo hasta el upgrade.
# Tracked: reactivar strict=True despues del upgrade mypy y anadir stubs celery.
[mypy-apps.common.utils.celery_utils]
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
disable_error_code = attr-defined,untyped-decorator,return-value,func-returns-value,no-any-return

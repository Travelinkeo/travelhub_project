[mypy]
python_version = 3.13
strict = False
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
show_error_codes = True
ignore_missing_imports = True
disable_error_code = no-untyped-def,no-untyped-call,arg-type,assignment,truthy-function
# Django
plugins = mypy_django_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = travelhub.settings

# Ignorar librerías sin stubs
[mypy-rest_framework.*]
ignore_missing_imports = True

[mypy-django_filters.*]
ignore_missing_imports = True

[mypy-weasyprint.*]
ignore_missing_imports = True

[mypy-fitz.*]
ignore_missing_imports = True

[mypy-twilio.*]
ignore_missing_imports = True

[tool.mypy]
python_version = 3.13
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
exclude = [
    "migrations",
    ".venv",
    "venv",
    "env",
    "envs",
    ".git",
    "logs",
    "scripts",
    "scratch",
    "wpp_sessions",
]



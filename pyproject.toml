[tool.mypy]
python_version = 3.13
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
exclude = [
    "migrations",
    ".venv",
    "venv",
    "env",
    "envs",
    ".git",
    "logs",
    "scripts",
    "scratch",
    "wpp_sessions",
]

[tool.ruff]
line-length = 127
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[pytest]
DJANGO_SETTINGS_MODULE = travelhub.settings.testing
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = scripts env venv .venv .git logs wpp_sessions scratch
addopts =
    --nomigrations
    --no-header
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    --randomly-dont-reorganize
    -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::urllib3.exceptions.DependencyWarning
    ignore::UserWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests (multi-capa, DB + cache real)
    unit: marks tests as unit tests (rápidos, sin DB ni IO)
    services: marks tests for service-layer business logic
    views: marks tests for view-layer (status, template, permissions)
    admin: marks tests for Django admin registration, actions, inlines
    models: marks tests for model validation, constraints, signals
    critical: marks tests for critical business logic
    e2e: marks tests as end-to-end (Playwright) — requires live_server + browser
    vcr: simula respuestas de red guardadas en cassettes
    celery: marks tests for Celery tasks (eager execution)

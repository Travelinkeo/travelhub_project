[pytest]
DJANGO_SETTINGS_MODULE = travelhub.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = scripts env venv .venv .git logs wpp_sessions scratch
addopts = 
    --nomigrations  
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::urllib3.exceptions.DependencyWarning
    ignore::UserWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    critical: marks tests for critical business logic
    vcr: simula respuestas de red guardadas en cassettes
openapi: 3.0.3
info:
  title: TravelHub API
  version: 2.0.0
  description: |-
    API REST de TravelHub — CRM/ERP SaaS para Agencias de Viajes.

    **Características:**
    - Gestión de Boletos Aéreos (KIU, SABRE, AMADEUS)
    - Facturación VEN-NIF (IVA, IGTF, doble moneda)
    - Contabilidad automatizada (Plan de Cuentas, Asientos)
    - CRM con Kanban IA y gestión de clientes
    - Conciliación inteligente y liquidación a proveedores
    - Dashboard de métricas y alertas en tiempo real
    - Multi-tenancy (SaaS con planes FREE/BASIC/PRO/ENTERPRISE)

    Autenticación vía JWT, Token o Session según el endpoint.
  contact:
    name: TravelHub Team
    email: soporte@travelhub.cc
    url: https://travelhub.cc
  license:
    name: Proprietary — TravelHub SaaS
    url: https://travelhub.cc/terms
paths:
  /accounting/api/tasas/actuales/:
    get:
      operationId: accounting_api_tasas_actuales_retrieve
      description: Obtiene las tasas de cambio vigentes de Venezuela (BCV oficial,
        promedio, P2P). Auto-actualiza cada 4 horas.
      tags:
      - Tasas BCV
      security:
      - tokenAuth: []
      - cookieAuth: []
      - BearerAuth: []
      - TokenAuth: []
      - SessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Tasas actuales de Venezuela
          description: ''
        '503':
          content:
            application/json:
              schema:
                description: No se pudieron obtener las tasas
          description: ''
  /accounting/api/tasas/bcv/:
    get:
      operationId: accounting_api_tasas_bcv_retrieve
      description: Obtiene solo la tasa BCV oficial simplificada (ideal para headers

<!-- templates/finance/form_pago_inner.html -->
<!-- Modal Reactivo de Registro de Pagos Inyectable por HTMX -->

<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-surface-base/60 backdrop-blur-sm"
     x-data="{
         open: true,
         isSpecialTaxpayer: false,
         paymentMethod: '',
         baseAmount: '',
         closeModal() {
             this.open = false;
             setTimeout(() => {
                 const container = document.getElementById('modal-container');
                 if (container) {
                     container.innerHTML = '';
                 }
             }, 200);
         },
         get requiresIgtf() {
             return this.isSpecialTaxpayer && (this.paymentMethod === 'efectivo_usd' || this.paymentMethod === 'efectivo_eur');
         },
         get igtfSurcharge() {
             if (this.requiresIgtf) {
                 const base = parseFloat(this.baseAmount);
                 return isNaN(base) ? 0.00 : parseFloat((base * 0.03).toFixed(2));
             }
             return 0.00;
         },
         get totalAmount() {
             const base = parseFloat(this.baseAmount);
             const baseVal = isNaN(base) ? 0.00 : base;
             return parseFloat((baseVal + this.igtfSurcharge).toFixed(2));
         }
     }"
     x-show="open"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0">

    <div class="bg-surface-1 rounded-xl shadow-xl w-full max-w-lg p-6 border border-border-color"
         @click.outside="closeModal()"
         x-show="open"
         x-transition:enter="transition ease-out duration-300 transform"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-200 transform"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95">

        <!-- Estructura vertical autocontenida que alinea simétricamente todos los bloques -->
        <div class="flex flex-col space-y-6">
            <!-- Modal Header -->
            <div class="flex items-center justify-between border-b border-border-color pb-4">
                <div>
                    <h3 class="text-lg font-bold text-text-main">Registrar Transacción de Pago</h3>
                    <p class="text-xs text-text-muted">Ingrese los datos para procesar el recargo contable</p>
                </div>
                <button @click="closeModal()" class="text-text-muted hover:text-text-main focus:outline-none transition-colors" aria-label="Cerrar modal">
                    <span class="material-symbols-outlined text-[20px]">close</span>
                </button>
            </div>

            <!-- Modal Body Form: Implementa el Layout de Formulario Estricto -->
            <form class="space-y-4 sm:space-y-5" @submit.prevent>
                <!-- Switch/Checkbox de Contribuyente Especial -->
                <div class="flex items-center gap-3">
                    <input type="checkbox"
                           id="is_special_taxpayer"
                           x-model="isSpecialTaxpayer"
                           class="w-4 h-4 text-primary border-border-color bg-surface-1 rounded focus:ring-primary focus:ring-offset-0">
                    <label for="is_special_taxpayer" class="text-sm font-semibold text-text-muted cursor-pointer select-none">
                        La agencia es Contribuyente Especial (Aplica IGTF 3%)
                    </label>
                </div>

                <!-- Selector de Canal de Pago -->
                <div class="flex flex-col gap-1.5">
                    <label for="canal_pago" class="text-xs font-bold uppercase tracking-wider text-text-muted">
                        Canal de Pago
                    </label>
                    <select id="canal_pago" x-model="paymentMethod" class="input-base">
                        <option value="">Seleccione un canal...</option>
                        <option value="zelle">Zelle (Transferencia USD - Exento)</option>
                        <option value="transferencia_bs">Transferencia Bolívares (Bs - Exento)</option>
                        <option value="efectivo_usd">Efectivo USD (Sujeto a IGTF 3%)</option>
                        <option value="efectivo_eur">Efectivo EUR (Sujeto a IGTF 3%)</option>
                    </select>
                </div>

                <!-- Input de Monto Base -->
                <div class="flex flex-col gap-1.5">
                    <label for="monto_base" class="text-xs font-bold uppercase tracking-wider text-text-muted">
                        Monto Base ($)
                    </label>
                    <input type="number"
                           step="0.01"
                           id="monto_base"
                           x-model="baseAmount"
                           placeholder="0.00"
                           class="input-base"
                           required>
                </div>

                <!-- Desglose de Recargo IGTF y Totales Reactivo por Alpine.js -->
                <div x-show="baseAmount > 0" x-collapse class="space-y-4">
                    <hr class="border-border-color">
                    <div class="flex flex-col space-y-2">
                        <div class="flex justify-between text-sm">
                            <span class="text-text-muted">Monto Base:</span>
                            <span class="font-mono text-text-main" x-text="'$ ' + parseFloat(baseAmount || 0).toFixed(2)"></span>
                        </div>
                        <div class="flex justify-between text-sm" x-show="requiresIgtf">
                            <span class="text-amber-600 dark:text-amber-400 font-medium">Recargo IGTF (3%):</span>
                            <span class="font-mono text-amber-600 dark:text-amber-400 font-bold" x-text="'+$ ' + parseFloat(igtfSurcharge || 0).toFixed(2)"></span>
                        </div>
                        <hr class="border-border-color">
                        <div class="flex justify-between text-base font-bold">
                            <span class="text-text-main">Monto Total a Recaudar:</span>
                            <span class="font-mono text-primary" x-text="'$ ' + parseFloat(totalAmount || 0).toFixed(2)"></span>
                        </div>
                    </div>
                </div>
            </form>

            <!-- Modal Footer -->
            <div class="flex justify-end gap-3 border-t border-border-color pt-4">
                <button type="button"
                        @click="closeModal()"
                        class="px-4 py-2 border border-border-color text-text-muted hover:bg-surface-2 text-sm font-semibold rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    Cancelar
                </button>
                <button type="submit"
                        class="px-4 py-2 bg-primary hover:bg-primary/90 text-white text-sm font-semibold rounded-lg shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    Guardar Transacción
                </button>
            </div>
        </div>
    </div>
</div>
